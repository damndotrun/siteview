<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A · Olvasási sor</title>
<link rel="stylesheet" href="../keret.css">
<style>
/* A irány tokenjei: vizualis-irany.md „A irány” Tokenek. Csak ezek használhatók. */
:root {
  --a-bg:#ffffff; --a-text:#141414; --a-meta:#6f6f6f; --a-state:#9a9a9a; --a-line:#eeeeee;
  --a-hit:#fbf3c6; --a-selected:#f4f4f4; --a-icon:#7f7f7f; --a-progress-track:#cccccc; --a-progress:#000000;
  --a-hud:rgba(68,68,68,.92); --a-label-color:#808080; --a-dim:#8a8a8a;
  --a-pop-shadow:0 4px 16px rgba(0,0,0,.08);
  --a-font-ui:"Segoe UI",system-ui,sans-serif; --a-font-read:"Sitka Text",Charter,"Bitstream Charter",Georgia,serif;
  --a-title:600 14px/1.3 var(--a-font-ui); --a-meta-font:400 12px/1.35 var(--a-font-ui);
  --a-label:600 11px/1 var(--a-font-ui); --a-read:400 15px/1.6 var(--a-font-read);
  --a-radius-icon:6px; --a-row-pad:10px 14px;
}
.a { position: relative; display: grid; grid-template-columns: 40px minmax(0, 1fr); height: 100%; background: var(--a-bg); color: var(--a-text); font: var(--a-meta-font); }
button { font: inherit; color: inherit; }
/* Modulindítók: keskeny ikonoszlop felirat nélkül (Matter olvasónézet bal oldala: ▷, archív, Aa, ⋯) */
.rail { display: flex; flex-direction: column; align-items: center; padding: 10px 0 8px; }
.rail .mods { display: flex; flex-direction: column; gap: 4px; }
.rail button { position: relative; width: 32px; height: 32px; display: grid; place-items: center; border: 0; background: none; color: var(--a-icon); cursor: pointer; border-radius: var(--a-radius-icon); }
.rail button:hover, .rail button.on { color: var(--a-text); }
.rail button.busy::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: 3px; height: 2px; background: linear-gradient(90deg, var(--a-progress) var(--p, 40%), var(--a-progress-track) 0); }
.rail .sp { flex: 1; }
.main { container-type: inline-size; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
/* Keresősor: szegély nélküli mező, alatta hajszálvonal (Matter keresés) */
.search { flex: none; display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 10px 0 14px; border-bottom: 1px solid var(--a-line); color: var(--a-icon); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font: 400 15px/1 var(--a-font-ui); color: var(--a-text); padding: 0; }
.search input::placeholder { color: var(--a-state); }
.ib { border: 0; background: none; color: var(--a-icon); cursor: pointer; padding: 4px; display: grid; border-radius: var(--a-radius-icon); }
/* Meta sor: a Matter „Viktor · July 26” sorának hangján; benne az ablak, a darab, a Szűrő és a Rendezés */
.bar { flex: none; display: flex; align-items: center; gap: 4px 12px; min-height: 34px; padding: 6px 12px 6px 14px; color: var(--a-meta); white-space: nowrap; }
.bar .l { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.bar b { font-weight: 600; color: var(--a-text); }
.tl { border: 0; background: none; padding: 0; color: var(--a-meta); cursor: pointer; display: inline-flex; align-items: center; gap: 3px; }
.tl:hover, .tl.on { color: var(--a-text); }
.tl.on { font-weight: 600; }
.lnk { border: 0; background: none; padding: 0; color: var(--a-text); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; cursor: pointer; }
.lnk:disabled { color: var(--a-state); cursor: default; text-decoration: none; }
.filt, .note, .cnt { flex: none; padding: 0 12px 8px 14px; color: var(--a-meta); }
.cnt b { font-weight: 600; color: var(--a-text); }
/* A legkisebb panelszélességen a meta sor gombjai ikon nélkül */
@container (max-width: 300px) { .bar .tl[data-menu="szuro"] .li, .bar .tl[data-menu="rendezes"] .li { display: none; } .bar { gap: 4px 10px; } }
.filt .x { border: 0; background: none; padding: 0 2px; color: var(--a-icon); cursor: pointer; vertical-align: -3px; }
.note { color: var(--a-text); }
.list { flex: 1; overflow: auto; min-height: 0; border-top: 1px solid var(--a-line); }
.wl { padding: 14px 14px 2px; font: 600 12px/1.3 var(--a-font-ui); color: var(--a-text); }
.wl span { font-weight: 400; color: var(--a-meta); }
/* Csoportcím: kis nagybetűs forráscímke (Matter „NNGROUP”), a Chrome csoportszín pöttyével; kattintásra összecsukódik */
.label { display: flex; align-items: center; gap: 7px; padding: 16px 12px 7px 14px; font: var(--a-label); letter-spacing: .08em; text-transform: uppercase; color: var(--a-label-color); cursor: pointer; user-select: none; }
.label i { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.label .n { font-weight: 400; }
.label .chev { margin-left: auto; display: grid; color: var(--a-icon); }
.row { position: relative; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 0 10px; padding: var(--a-row-pad); border-bottom: 1px solid var(--a-line); cursor: pointer; user-select: none; }
.row.on { background: var(--a-selected); }
.row .ic { grid-row: span 3; width: 28px; height: 28px; border-radius: var(--a-radius-icon); background: var(--a-selected); display: grid; place-items: center; color: var(--a-text); }
.row.on .ic { background: var(--a-bg); }
.row .ic .fav-none { color: var(--a-icon); }
.row .t { font: var(--a-title); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row.slept .t { color: var(--a-dim); }
.row.res .t { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.row .m { display: flex; gap: 8px; margin-top: 2px; color: var(--a-meta); white-space: nowrap; min-width: 0; }
.row .m .d { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.row .m .s { margin-left: auto; flex: none; color: var(--a-state); }
.row .snip { margin-top: 4px; color: var(--a-meta); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row .rm { position: absolute; right: 8px; top: 8px; display: none; background: var(--a-bg); }
.row.on .rm { background: var(--a-selected); }
.row:hover .rm { display: grid; }
mark.hit { background: var(--a-hit); color: inherit; padding: 0 1px; }
.row .job { margin-top: 7px; cursor: default; }
.prog { height: 2px; background: var(--a-progress-track); width: 110px; position: relative; overflow: hidden; }
.prog b { position: absolute; left: 0; top: 0; bottom: 0; background: var(--a-progress); }
.prog.ind b { width: 18px; animation: ind 1.6s linear infinite; }
@keyframes ind { from { left: -18px; } to { left: 110px; } }
.row .job .tx { margin-top: 5px; color: var(--a-meta); white-space: normal; }
/* Kompakt sűrűség (TS10): egy sor; a cím és a meta egymás mellett */
.dens-kompakt .row { grid-template-columns: 18px minmax(0, 1fr) auto; align-items: center; padding: 6px 12px 6px 14px; gap: 0 8px; }
.dens-kompakt .row .ic { grid-row: auto; width: 18px; height: 18px; background: none; }
.dens-kompakt .row.res, .dens-kompakt .row.hasjob { grid-template-columns: 18px minmax(0, 1fr); }
.dens-kompakt .row:not(.res):not(.hasjob) .m { margin: 0; max-width: 46%; }
.dens-kompakt .row .rm { top: 4px; }
.dens-kompakt .label { padding-top: 12px; }
.more { padding: 12px 14px; color: var(--a-meta); }
.empty { padding: 18px 14px 10px; }
.empty h3 { margin: 0 0 6px; font: var(--a-title); }
.empty p { margin: 0 0 10px; color: var(--a-meta); }
/* Olvasónézet (Matter átirat): forráscímke, cím, meta, talpas olvasott szöveg */
.reader { flex: 1; overflow: auto; padding: 14px 20px 18px; min-height: 0; }
.reader .back { display: inline-flex; align-items: center; gap: 4px; color: var(--a-meta); margin-bottom: 16px; text-decoration: none; }
.reader .src { font: var(--a-label); letter-spacing: .08em; text-transform: uppercase; color: var(--a-label-color); }
.reader h1 { margin: 9px 0 6px; font: 800 22px/1.2 var(--a-font-ui); letter-spacing: -.01em; }
@container (max-width: 300px) { .reader h1 { font-size: 19px; } }
.reader .rm2 { color: var(--a-meta); margin-bottom: 18px; }
.reader ul { margin: 0 0 16px; padding-left: 18px; }
.reader li, .reader .qa p { margin: 0 0 10px; font: var(--a-read); color: var(--a-text); }
.reader .run { display: flex; flex-direction: column; gap: 7px; margin: 4px 0 20px; color: var(--a-meta); }
.reader .qa { border-top: 1px solid var(--a-line); padding-top: 12px; margin-top: 8px; }
.reader .qa .q { font: var(--a-title); margin-bottom: 6px; }
.reader .exp { margin: 12px 0 16px; color: var(--a-meta); display: flex; gap: 12px; }
.seg { margin: 0 0 10px; font: var(--a-read); cursor: pointer; }
.seg .ts { display: inline-block; min-width: 44px; font: var(--a-meta-font); color: var(--a-meta); }
.seg:hover .ts { color: var(--a-text); }
.ask { flex: none; border-top: 1px solid var(--a-line); padding: 10px 14px 12px; }
.ask .pr { color: var(--a-meta); margin-bottom: 8px; }
.ask .ar { display: flex; gap: 8px; align-items: center; }
.ask input { flex: 1; min-width: 0; border: 0; outline: 0; font: 400 13px/1.3 var(--a-font-ui); color: var(--a-text); }
.ask input::placeholder { color: var(--a-state); }
.ask kbd { font: var(--a-meta-font); color: var(--a-state); }
/* Menü: fehér, hajszálvonal, a Matter hangján; a tételek a közös működésből jönnek */
.menu { position: absolute; z-index: 10; min-width: 210px; max-width: 280px; overflow: auto; background: var(--a-bg); border: 1px solid var(--a-line); border-radius: var(--a-radius-icon); box-shadow: var(--a-pop-shadow); padding: 6px 0; }
.menu .mh { padding: 10px 12px 5px; font: var(--a-label); letter-spacing: .08em; text-transform: uppercase; color: var(--a-label-color); }
.menu .mh:first-child { padding-top: 6px; }
.menu .mi { width: 100%; display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 12px; border: 0; background: none; font: 400 13px/1 var(--a-font-ui); color: var(--a-text); text-align: left; cursor: pointer; white-space: nowrap; }
.menu .mi:hover { background: var(--a-selected); }
.menu .mi:disabled { color: var(--a-state); cursor: default; background: none; }
.menu .mi .ck { width: 14px; display: grid; flex: none; }
.menu .mi i { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.menu .mi .n { margin-left: auto; color: var(--a-state); }
.menu .ms { height: 1px; background: var(--a-line); margin: 6px 0; }
.menu .mnote { padding: 6px 12px 4px; color: var(--a-meta); white-space: normal; }
.menu .mp { display: flex; align-items: center; gap: 6px; padding: 2px 12px 4px 34px; font: 400 13px/1 var(--a-font-ui); }
.menu .mp input { width: 90px; border: 0; border-bottom: 1px solid var(--a-line); outline: 0; font: 400 13px/1.6 var(--a-font-ui); color: var(--a-text); padding: 0 2px; }
/* HUD a videón: ott jelenik meg, ahol görgetsz */
.hud-vol { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 36px; height: 132px; border-radius: 6px; background: var(--a-hud); color: #fff; font: 600 11px/1 var(--a-font-ui); text-align: center; padding-top: 9px; }
.hud-vol .tr { position: absolute; left: 17px; bottom: 14px; width: 2px; height: 88px; background: rgba(255,255,255,.35); }
.hud-vol .tr b { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; }
.hud-vol .tr i { position: absolute; left: -6px; width: 14px; height: 14px; margin-bottom: -7px; border-radius: 50%; background: #fff; }
.hud-time { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); border-radius: 6px; background: var(--a-hud); color: #fff; padding: 9px 11px 10px; font: 400 11px/1.3 var(--a-font-ui); }
.hud-time .v { font: 600 15px/1.2 var(--a-font-ui); }
.hud-time .k { color: rgba(255,255,255,.75); margin: 1px 0 7px; }
.hud-time .tr { width: 96px; height: 2px; background: rgba(255,255,255,.35); position: relative; }
.hud-time .tr b { position: absolute; left: 0; top: 0; bottom: 0; background: #fff; }
.hud-mid { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); border-radius: 6px; background: var(--a-hud); color: #fff; padding: 8px 12px; font: 600 13px/1 var(--a-font-ui); }
.hud-job { position: absolute; left: 14px; top: 14px; border-radius: 6px; background: var(--a-hud); color: #fff; padding: 8px 11px 9px; font: 400 12px/1.3 var(--a-font-ui); }
.hud-job .tr { margin-top: 5px; width: 120px; height: 2px; background: rgba(255,255,255,.35); position: relative; }
.hud-job .tr b { position: absolute; left: 0; top: 0; bottom: 0; background: #fff; }
.hud-job .lnk { color: #fff; text-decoration-color: rgba(255,255,255,.5); margin-left: 8px; }
</style>
</head>
<body>
<script src="../ikonok.js"></script>
<script src="../vonalas-ikonok.js"></script>
<script src="../adat.js"></script>
<script src="../mukodes.js"></script>
<script src="../keret.js"></script>
<script>
(function () {
  const esc = SV.esc, st = M.st;

  function stateText(t) { return M.states(t).map((s) => s.label).join(' · '); }
  function jobBlock(t) {
    const j = M.job();
    if (!j || t.id !== M.VIDEO_TAB) return '';
    const fut = j.state === 'fut';
    return `<div class="job">${fut ? `<div class="prog"><b style="width:${j.pct}%"></b></div>` : ''}<div class="tx">${M.jobText()} · <button class="lnk" data-op="jobOpen">Átirat</button>${fut ? ' · <button class="lnk" data-op="jobCancel">Megszakítás</button>' : ''}</div></div>`;
  }
  function row(t, r, q) {
    const sel = st.sel.has(t.id);
    const cls = ['row', t.active ? 'on' : '', t.discarded ? 'slept' : '', r ? 'res' : '', M.job() && t.id === M.VIDEO_TAB ? 'hasjob' : ''].join(' ');
    const title = r && r.inTitle ? SV.mark(t.title, q, 'hit') : esc(t.title);
    const p = M.price(t);
    let meta = `${esc(SV.domain(t.url))}${p ? ' · ' + p : ''} · ${t.active ? 'most' : SV.ago(t.last)}`;
    if (r) meta = `${M.WHY[r.why]} · ${t.win !== M.CUR ? `${t.win}. ablak · ` : ''}${esc(SV.domain(t.url))}${p ? ' · ' + p : ''}`;
    let snip = '';
    if (r && r.why === 'szoveg') snip = `<div class="snip">${SV.mark(SV.snippet(t.text, q, 34), q, 'hit')}</div>`;
    else if (r && r.why === 'url') snip = `<div class="snip">${SV.mark(SV.snippet(t.url, q, 30), q, 'hit')}</div>`;
    const s = stateText(t);
    return `<div class="${cls}" data-tab="${t.id}"${sel ? ' aria-selected="true"' : ''}><span class="ic">${sel ? lineIcon('check', 16) : SV.favicon(t, 16)}</span><div class="t">${title}</div><div class="m"><span class="d">${meta}</span>${s ? `<span class="s">${s}</span>` : ''}</div>${snip}${jobBlock(t)}<button class="ib rm" data-rowmenu="${t.id}" title="Műveletek (vagy jobb klikk)">${lineIcon('ellipsis', 16)}</button></div>`;
  }
  function listHTML() {
    const secs = M.sections();
    if (!secs.some((s) => s.shown)) { const e = M.emptyList(); return `<div class="empty"><h3>${e.title}</h3><p>${e.text}</p><button class="lnk" data-op="${e.action.op}">${e.action.label}</button></div>`; }
    let h = '';
    for (const s of secs) {
      if (st.win === 'mind') h += `<div class="wl">${s.title} <span>· ${s.total} tab</span></div>`;
      for (const g of s.groups) {
        h += `<div class="label" data-g="${g.id}" data-op="collapse" data-arg="${g.id}" title="${g.collapsed ? 'Kinyitás' : 'Összecsukás'}">${g.color ? `<i style="background:${g.color}"></i>` : ''}${esc(g.title)} <span class="n">· ${g.tabs.length}</span><span class="chev">${lineIcon(g.collapsed ? 'chevron-right' : 'chevron-down', 14)}</span></div>`;
        if (!g.collapsed) h += g.tabs.map((t) => row(t)).join('');
      }
    }
    return h;
  }
  function resultsHTML(r) {
    const hint = M.otherHint(r);
    const hintH = hint ? `<div class="more">${hint.text} · <button class="lnk" data-op="${hint.op}" data-arg="${hint.arg}">${hint.label}</button></div>` : '';
    if (!r.list.length) { const e = M.empty(r); return `<div class="empty"><h3>${e.title}</h3><p>${esc(e.text)}</p><button class="lnk" data-op="${e.action.op}">${e.action.label}</button></div>${hintH}`; }
    return r.list.map((x) => row(x.tab, x, r.q)).join('') + hintH;
  }
  function barHTML(r) {
    if (st.sel.size) return `<div class="bar"><span class="l"><b>${st.sel.size} kijelölve</b></span><button class="tl" data-menu="rendezes">${lineIcon('arrow-up-down', 13)}Rendezés</button><button class="tl" data-op="selClear">Mégse</button></div>`;
    const nf = M.activeFilters().length;
    const win = `<button class="tl" data-menu="ablak">${st.win === 'mind' ? 'Minden ablak' : 'Ez az ablak'}${lineIcon('chevron-down', 12)}</button>`;
    const left = r ? win : `${win} · ${M.sections().reduce((n, s) => n + s.shown, 0)} tab`;
    // Kereséskor a találatok száma külön sorban, hogy keskeny panelen is egészben látsszon.
    const cnt = r && r.list.length ? `<div class="cnt">${M.countLine(r).replace(/^(\d+ találat)/, '<b>$1</b>')}</div>` : '';
    return `<div class="bar"><span class="l">${left}</span><button class="tl ${nf ? 'on' : ''}" data-menu="szuro">${lineIcon('list-filter', 13)}Szűrő${nf ? ' · ' + nf : ''}</button><button class="tl" data-menu="rendezes">${lineIcon('arrow-up-down', 13)}Rendezés</button></div>${cnt}`;
  }
  function filtHTML() {
    const f = M.activeFilters();
    if (!f.length) return '';
    return `<div class="filt">Szűrve: ${f.map((x) => `${esc(x.label)}<button class="x" data-op="${x.op}" data-arg="${x.arg == null ? '' : x.arg}" title="Kikapcsolás">${lineIcon('x', 12)}</button>`).join(', ')} · <button class="lnk" data-op="clearFilters">Szűrők törlése</button></div>`;
  }
  function readerSummary() {
    const s = M.sum;
    const items = M.sumItems();
    const run = s.state === 'fut' ? `<div class="run"><div class="prog ind"><b></b></div><div>${M.sumStateText()} <button class="lnk" data-op="sumStop">Leállítás</button></div></div>` : s.state === 'leallitva' ? '<div class="run">Leállítva. Az eddigi szöveg megmaradt.</div>' : '';
    return `<div class="reader" data-list>
      <button class="lnk back" data-op="back">${lineIcon('arrow-left', 14)}Tabok</button>
      <div class="src">${esc(s.domain)} · ${s.kind.toLowerCase()}</div>
      <h1>${esc(s.source)}</h1>
      <div class="rm2">Claude · ${esc(s.prompt)}${s.state === 'fut' ? '' : ' · ' + M.sumStateText()}</div>
      <ul>${items.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>${run}
      ${s.qa.map((x) => `<div class="qa"><div class="q">${esc(x.q)}</div><p>${esc(x.a)}</p></div>`).join('')}
    </div>
    <div class="ask"><div class="pr">Mentett prompt: ${SV.prompts.map((p, i) => `<button class="lnk" data-op="prompt" data-arg="${i}">${esc(p)}</button>`).join(', ')}</div>
      <div class="ar"><input data-ask placeholder="Kérdezz az oldalról" value="${esc(M.ui.askDraft || '')}"><kbd>Enter</kbd></div></div>`;
  }
  function readerTranscript() {
    const j = M.job(), v = M.tab(M.VIDEO_TAB), fut = j && j.state === 'fut';
    const segs = M.segments(), acts = M.transcriptActions();
    const btn = (a) => `<button class="lnk" data-op="${a.op}" data-arg="${a.arg || ''}"${a.disabled ? ' disabled' : ''}${a.title ? ` title="${a.title}"` : ''}>${a.label}</button>`;
    return `<div class="reader" data-list>
      <button class="lnk back" data-op="back">${lineIcon('arrow-left', 14)}Tabok</button>
      <div class="src">${esc(SV.domain(v.url))} · felirat</div>
      <h1>${esc(v.title)}</h1>
      <div class="rm2">${j ? M.jobText() : 'Még nincs felirat'} · ${btn(acts[0])}</div>
      ${fut ? `<div class="prog" style="width:160px"><b style="width:${j.pct}%"></b></div>` : ''}
      <div class="exp">Mentés: ${acts.slice(1).map(btn).join('')}</div>
      ${segs.map(([t, x]) => `<p class="seg" data-op="seek" data-arg="${t}" title="Ugrás ide"><span class="ts">${Keret.fmt(t)}</span>${esc(x)}</p>`).join('')}
      ${fut ? '<div class="run">A többi rész átírás közben érkezik ide.</div>' : ''}
    </div>`;
  }
  function railHTML() {
    const j = M.job(), busy = j && j.state === 'fut';
    return `<nav class="rail" aria-label="Modulok"><div class="mods" data-launchers>${SV.moduleOrder('a').map((m) => `<button data-launch data-id="${m.id}" data-menu-side="right" class="${(st.view === 'osszefoglalo' && m.id === 'osszefoglalo') || (st.view === 'atirat' && m.id === 'felirat') ? 'on' : ''} ${busy && m.id === 'felirat' ? 'busy' : ''}" style="${busy && m.id === 'felirat' ? `--p:${j.pct}%` : ''}" title="${esc(m.name)}${m.key ? ' · ' + m.key : ''}${busy && m.id === 'felirat' ? ' · ' + M.jobText() : ''}\nHúzd a sorrendhez">${lineIcon(m.icon, 18)}</button>`).join('')}</div>
      <span class="sp"></span><button data-menu="tobb" data-menu-side="right" title="Sűrűség, beállítások">${lineIcon('ellipsis', 18)}</button></nav>`;
  }
  function menuHTML(kind, items) {
    return `<div class="menu" data-menubox role="menu">${items.map((it) => {
      if (it.t === 'head') return `<div class="mh">${esc(it.label)}</div>`;
      if (it.t === 'sep') return '<div class="ms"></div>';
      if (it.t === 'note') return `<div class="mnote">${esc(it.label)}</div>`;
      if (it.t === 'price') return `<label class="mp">${it.label} <input data-price inputmode="numeric" value="${it.value == null ? '' : it.value}" placeholder="pl. 20000"> Ft</label>`;
      const ck = it.t === 'act' ? '' : `<span class="ck">${it.on ? lineIcon('check', 14) : ''}</span>`;
      return `<button class="mi" role="${it.t === 'act' ? 'menuitem' : it.t === 'radio' ? 'menuitemradio' : 'menuitemcheckbox'}"${it.t !== 'act' ? ` aria-checked="${!!it.on}"` : ''} data-op="${it.op}" data-arg="${it.arg == null ? '' : it.arg}" ${it.disabled ? 'disabled' : ''}>${ck}${it.color ? `<i style="background:${it.color}"></i>` : ''}${esc(it.label)}${it.n != null ? `<span class="n">${it.n}</span>` : ''}</button>`;
    }).join('')}</div>`;
  }
  function draw() {
    let main;
    if (st.view === 'osszefoglalo') main = readerSummary();
    else if (st.view === 'atirat') main = readerTranscript();
    else {
      const r = M.results();
      main = `<div class="search">${lineIcon('search', 16)}<input data-q value="${esc(st.q)}" placeholder="Keresés: cím, URL, szöveg" aria-label="Keresés">${st.q ? `<button class="ib" data-op="clearSearch" title="Törlés (Esc)">${lineIcon('x', 16)}</button>` : ''}</div>
        ${barHTML(r)}${filtHTML()}${st.note ? `<div class="note">${esc(st.note.text)}</div>` : ''}
        <div class="list" data-list>${r ? resultsHTML(r) : listHTML()}</div>`;
    }
    return `<div class="a dens-${st.density}" data-root>${railHTML()}<div class="main">${main}</div></div>`;
  }
  function hudHTML(m) {
    const x = M.hudText(m);
    let h = '';
    if (m.ev === 'bal') h += `<div class="hud-vol" title="${x.volLabel}">${x.vol}<div class="tr"><b style="height:${m.vol}%"></b><i style="bottom:${m.vol}%"></i></div></div>`;
    else if (m.ev === 'jobb') h += `<div class="hud-time"><div class="v">${x.time}</div><div class="k">${x.step} · ${x.dur} · ${x.speed}</div><div class="tr"><b style="width:${(m.t / m.dur) * 100}%"></b></div></div>`;
    else if (m.ev === 'kozep') h += `<div class="hud-mid">${x.play}</div>`;
    if (x.job) h += `<div class="hud-job">${x.job}<button class="lnk" data-op="${x.jobAction.op}">${x.jobAction.label}</button><div class="tr"><b style="width:${m.job.pct}%"></b></div></div>`;
    else if (x.offer) h += `<div class="hud-job">${x.offer}<button class="lnk" data-op="${x.offerAction.op}">${x.offerAction.label}</button></div>`;
    return h;
  }

  Keret.init({ key: 'a', title: 'A · Olvasási sor', badge: { bg: '#000000', fg: '#ffffff' }, draw, menuHTML, hudHTML });
})();
</script>
</body>
</html>
